<div class="register-container">
    <h2>User Registration</h2>
    <form [formGroup]="registerForm" (ngSubmit)="registerUser()">
      
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" formControlName="username" placeholder="Enter your username">
        <small *ngIf="registerForm.controls['username'].invalid && registerForm.controls['username'].touched">
          Username is required.
        </small>
      </div>
  
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" placeholder="Enter your email">
        <small *ngIf="registerForm.controls['email'].invalid && registerForm.controls['email'].touched">
          Enter a valid email.
        </small>
      </div>
  
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="Enter password">
        <small *ngIf="registerForm.controls['password'].invalid && registerForm.controls['password'].touched">
          Password must be at least 6 characters.
        </small>
      </div>
  
      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" formControlName="address" placeholder="Enter your address">
      </div>
  
      <div class="form-group">
        <label for="phoneNumber">Phone Number</label>
        <input type="text" id="phoneNumber" formControlName="phoneNumber" placeholder="Enter your phone number">
        <small *ngIf="registerForm.controls['phoneNumber'].invalid && registerForm.controls['phoneNumber'].touched">
          Enter a valid 10-digit phone number.
        </small>
      </div>
  
      <button type="submit" [disabled]="registerForm.invalid">Register</button>
      <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  
      <p>Already have an account? <a routerLink="/login">Login here</a></p>
    </form>
  </div>
