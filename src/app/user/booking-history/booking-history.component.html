<div class="container">
    <h2>📜 Booking History</h2>
  
    <table class="table">
      <thead>
        <tr>
          <th>Car</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let booking of bookings">
          <td>{{ booking.car }}</td>
          <td>{{ booking.startDate }}</td>
          <td>{{ booking.endDate }}</td>
          <td>{{ booking.status }}</td>
        </tr>
      </tbody>
    </table>
  </div>
