<div class="container mt-4">
  <h2>User Profile</h2>

  <form [formGroup]="profileForm" (ngSubmit)="updateProfile()">
    <div class="mb-3">
      <label for="fullName" class="form-label">Full Name</label>
      <input type="text" id="fullName" class="form-control" formControlName="fullName" [readonly]="!isEditing">
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" class="form-control" formControlName="email" readonly>
    </div>

    <div class="mb-3">
      <label for="phone" class="form-label">Phone</label>
      <input type="text" id="phone" class="form-control" formControlName="phone" [readonly]="!isEditing">
    </div>

    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>

    <div class="mt-3">
      <button *ngIf="!isEditing" type="button" class="btn btn-primary" (click)="enableEdit()">Edit</button>
      <button *ngIf="isEditing" type="submit" class="btn btn-success">Save</button>
      <button *ngIf="isEditing" type="button" class="btn btn-secondary" (click)="cancelEdit()">Cancel</button>
    </div>
  </form>
</div>
