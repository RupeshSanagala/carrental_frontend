<div class="container mt-4">
    <h2 class="text-center mb-4">User Management</h2>
  
    <!-- Add New User Form -->
    <div class="card shadow p-4 mb-4">
      <h4 class="text-center">Add New User</h4>
      <form (ngSubmit)="addUser()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <input type="text" class="form-control" [(ngModel)]="newUser.username" name="username" placeholder="Username" required>
          </div>
          <div class="col-md-6 mb-3">
            <input type="email" class="form-control" [(ngModel)]="newUser.email" name="email" placeholder="Email" required>
          </div>
          <div class="col-md-6 mb-3">
            <input type="text" class="form-control" [(ngModel)]="newUser.address" name="address" placeholder="Address">
          </div>
          <div class="col-md-6 mb-3">
            <input type="text" class="form-control" [(ngModel)]="newUser.phone_Number" name="phone_Number" placeholder="Phone Number">
          </div>
          <div class="col-md-6 mb-3">
            <select class="form-select" [(ngModel)]="newUser.role" name="role">
              <option value="User">User</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
          <div class="col-12 text-center">
            <button type="submit" class="btn btn-primary px-4">Add User</button>
          </div>
        </div>
      </form>
    </div>
  
    <!-- User List Table -->
    <h4 class="mb-3">User List</h4>
    <div class="table-responsive">
      <table class="table table-hover table-bordered text-center">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Address</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td>{{ user.user_ID }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.address }}</td>
            <td>{{ user.phone_Number }}</td>
            <td>
              <select class="form-select form-select-sm" [(ngModel)]="user.role" (change)="assignRole(user, user.role)">
                <option value="User">User</option>
                <option value="Admin">Admin</option>
              </select>
            </td>
            <td>
              <button class="btn btn-sm" [ngClass]="user.isActive ? 'btn-success' : 'btn-secondary'" (click)="toggleStatus(user)">
                {{ user.isActive ? 'Active' : 'Inactive' }}
              </button>
            </td>
            <td>
              <button class="btn btn-warning btn-sm me-1" (click)="editUser(user)">Edit</button>
              <button class="btn btn-danger btn-sm me-1" (click)="deleteUser(user.user_ID)" *ngIf="user.bookingIds.length === 0">Delete</button>
              <button class="btn btn-info btn-sm" (click)="resetPassword(user)">Reset Password</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <!-- Edit User Form -->
    <div class="card shadow p-4 mt-4" *ngIf="selectedUser">
      <h4 class="text-center">Edit User</h4>
      <form (ngSubmit)="updateUser()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <input type="text" class="form-control" [(ngModel)]="selectedUser.username" name="username" required>
          </div>
          <div class="col-md-6 mb-3">
            <input type="email" class="form-control" [(ngModel)]="selectedUser.email" name="email" required>
          </div>
          <div class="col-12 text-center">
            <button type="submit" class="btn btn-success px-4">Update User</button>
          </div>
        </div>
      </form>
    </div>
  </div>
