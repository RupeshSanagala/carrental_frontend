<!-- Booking Management Table -->
<table class="table table-bordered">
  <thead>
    <tr>
      <th>Booking ID</th>
      <th>Customer Name</th>
      <th>Car Reserved</th>
      <th>Booking Date</th>
      <th>Pick-Up Date</th>
      <th>Return Date</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let booking of bookings">
      <td>{{ booking.id }}</td>
      <td>{{ booking.customerName }}</td>
      <td>{{ booking.car }}</td>
      <td>{{ booking.bookingDate }}</td>
      <td>{{ booking.pickupDate }}</td>
      <td>{{ booking.returnDate }}</td>
      <td>{{ booking.status }}</td>
      <td>
        <button class="btn btn-warning" (click)="editBooking(booking)">Edit</button>
        <button class="btn btn-success" (click)="confirmBooking(booking)">Confirm</button>
        <button class="btn btn-danger" (click)="cancelBooking(booking)">Cancel</button>
        <button class="btn btn-info" (click)="viewBookingDetails(booking)">View</button>
      </td>
    </tr>
  </tbody>
</table>

<!-- Booking Form -->
<form *ngIf="showForm" #bookingForm="ngForm" (ngSubmit)="saveBooking()">
  <div class="mb-3">
    <label class="form-label">Customer Name</label>
    <input type="text" class="form-control" [(ngModel)]="selectedBooking.customerName" name="customerName" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Car</label>
    <input type="text" class="form-control" [(ngModel)]="selectedBooking.car" name="car" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Pick-Up Date</label>
    <input type="date" class="form-control" [(ngModel)]="selectedBooking.pickupDate" name="pickupDate" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Return Date</label>
    <input type="date" class="form-control" [(ngModel)]="selectedBooking.returnDate" name="returnDate" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Status</label>
    <select class="form-control" [(ngModel)]="selectedBooking.status" name="status" required>
      <option value="Pending">Pending</option>
      <option value="Confirmed">Confirmed</option>
      <option value="Completed">Completed</option>
      <option value="Cancelled">Cancelled</option>
    </select>
  </div>

  <button type="submit" class="btn btn-primary">{{ isEditing ? 'Update Booking' : 'Add Booking' }}</button>
  <button type="button" class="btn btn-secondary" (click)="toggleForm()">Cancel</button>
</form>
